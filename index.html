<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic -->
    <link rel="icon" href="/favicon.ico" sizes="any"><!-- .ico with embedded 16 & 32 px -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Optional extras -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- iOS home-screen -->
    <meta name="theme-color" content="#ffffff"><!-- address-bar tint on mobile Chrome -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERAL, Animal Behavior Segmentation</title>
    <meta name="description" content="FERAL is an open-source toolkit for supervised animal behavior segmentation. No pose estimation. Install with one pip command.">
    <link rel="stylesheet" href="/assets/site.css">
    <link rel="describedby" type="text/markdown" href="/llms.txt">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">



    <style>
        :root {
            --page-bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --hairline: #e2e8f0;
            --ink-900: #0f172a;
            --ink-700: #334155;
            --ink-500: #64748b;
            --ink-400: #94a3b8;
            --accent: #059669;
            --accent-hover: #047857;
        }

        html { scroll-behavior: smooth; }

        /* Mobile: let long shell commands wrap instead of scrolling off-screen */
        @media (max-width: 640px) {
            pre, pre code {
                white-space: pre-wrap;
                word-break: break-all;
            }
            /* Make wide reference tables horizontally scrollable instead of overflowing the page */
            table {
                display: block;
                overflow-x: auto;
                max-width: 100%;
            }
        }

        body {
            font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--page-bg);
            color: var(--ink-900);
            background-image:
                radial-gradient(at 100% 0%, rgba(16,185,129,0.06) 0px, transparent 55%),
                radial-gradient(at 0% 100%, rgba(15,23,42,0.04) 0px, transparent 55%);
            background-attachment: fixed;
        }

        h1, h2, h3, h4 {
            letter-spacing: -0.025em;
        }

        .font-display {
            font-family: 'Newsreader', ui-serif, Georgia, serif;
            font-weight: 500;
            letter-spacing: -0.012em;
            font-optical-sizing: auto;
        }

        /* Refined scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; border: 2px solid transparent; }

        /* Selection */
        ::selection { background: rgba(16,185,129,0.18); color: #064e3b; }

        /* Inline code */
        code:not(pre code) {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 0.86em;
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 0.06em 0.4em;
        }

        /* Code block "terminal" wrapper */
        .terminal {
            background: #0b1220;
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 14px;
            color: #cbd5e1;
            box-shadow: 0 1px 3px rgba(2,6,23,0.4), 0 12px 28px -16px rgba(2,6,23,0.55);
            overflow: hidden;
        }
        .terminal__bar {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(148,163,184,0.12);
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0));
            font: 500 11px/1 'JetBrains Mono', monospace;
            color: #94a3b8;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .terminal__dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
        .terminal__dot--r { background: #f87171; }
        .terminal__dot--y { background: #fbbf24; }
        .terminal__dot--g { background: #34d399; }
        .terminal__body {
            padding: 16px 18px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            color: #e2e8f0;
            overflow-x: auto;
        }
        .terminal__body .prompt { color: #34d399; user-select: none; }
        .terminal__body .comment { color: #64748b; }

        /* Surface card */
        .surface {
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: 1.25rem;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 12px rgba(15,23,42,0.04);
        }

        /* Pill */
        .pill {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.18rem 0.7rem;
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.04em; text-transform: uppercase;
            border-radius: 999px;
        }

        /* Anchor links subtle underline */
        a.link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(5,150,105,0.3);
            transition: border-color .15s ease, color .15s ease;
        }
        a.link:hover { color: var(--accent-hover); border-bottom-color: var(--accent-hover); }

        /* Sticky-header glass */
        .glass {
            background: rgba(255,255,255,0.7);
            backdrop-filter: saturate(160%) blur(14px);
            -webkit-backdrop-filter: saturate(160%) blur(14px);
            border-bottom: 1px solid rgba(15,23,42,0.06);
        }

        /* Subtle dotted background for hero */
        .dot-grid {
            background-image: radial-gradient(rgba(15,23,42,0.08) 1px, transparent 1.5px);
            background-size: 22px 22px;
            background-position: -1px -1px;
        }

        /* Display rule: a simple straight underline accent, drawn behind the text baseline */
        .display-rule {
            position: relative;
            display: inline;
            background-image: linear-gradient(to top, rgba(5,150,105,0.22) 0, rgba(5,150,105,0.22) 0.18em, transparent 0.18em);
            background-position: 0 88%;
            background-size: 100% 0.18em;
            background-repeat: no-repeat;
            padding: 0 0.04em;
        }

        /* Section anchor offset for sticky header */
        section[id] { scroll-margin-top: 88px; }

        /* Smooth section enter */
        @keyframes feralFadeUp {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        main > section { animation: feralFadeUp .35s ease-out both; }

        /* Sidebar-link refinements */
        .sidebar-group-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #94a3b8;
            padding: 0.5rem 0.75rem 0.25rem;
        }

        /* Hide focus ring for mouse users, keep it for keyboard */
        :focus:not(:focus-visible) { outline: none; box-shadow: none; }
    </style>

</head>
